# Gradle Version Catalog
# バージョンはここで一元管理する。個別の build.gradle.kts に直接書かない。
[versions]
springBoot = "4.1.1"
springDependencyManagement = "1.1.7"
spotless = "8.0.0"
palantirJavaFormat = "2.75.0"
dependencyCheck = "13.0.0"
springdoc = "3.1.1"
archunit = "1.5.0"
testcontainers = "1.21.3"
jjwt = "0.13.0"
logstashEncoder = "8.1"
jacoco = "0.8.14"
checkstyle = "14.1.0"
[libraries]
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }
logstash-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstashEncoder" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
dependency-check = { id = "org.owasp.dependencycheck", version.ref = "dependencyCheck" }